<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Spiral notebook in a unit square, with a 3D page offset. -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <rect x="35" y="16" width="61" height="84" rx="8" ry="8" stroke-width="8"/>
    <rect x="26" y="8" width="62" height="84" rx="8" ry="8" fill="white" stroke-width="8"/>
    <g stroke-width="15">
      <line x1="20" y1="32" x2="30" y2="32"/>
      <line x1="20" y1="50" x2="30" y2="50"/>
      <line x1="20" y1="68" x2="30" y2="68"/>
    </g>
    <g stroke-width="7">
      <line x1="42" y1="42" x2="72" y2="42"/>
      <line x1="42" y1="58" x2="72" y2="58"/>
    </g>
  </g>
</svg>
